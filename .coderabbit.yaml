# CodeRabbit の設定（このリポジトリ専用。プラグインとしては配布しない）。
# ルールの正本は CONTRIBUTING.md と、レビューの観点（plugins/dev-workflow/review/*.md、
# .claude/dev-workflow/review/*.md）の1か所だけにし、ここには書き写さない。
# 上限に引っかかったときの代わりのレビューは .github/workflows/claude-review.yml。
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja-JP

reviews:
  # 対応が要る指摘に Request changes を付け、最新のコミットのレビュー済み・必須のスレッドが resolved・
  # Pre-Merge Checks が通る・head が変わっていないときに approve する。無人のマージの承認に数える（ADR 000412）。
  # Pro プランの機能。試用期間後に使えるかは #160 と合わせて確かめる（使えなければ、この行を消す）
  request_changes_workflow: true
  auto_review:
    enabled: true
    # CodeRabbit の試用期間中は、全機能を使うため、push のたびにも増分でレビューする（暫定。#159）。
    # 試用期間が終わったら、PR を作ったときだけレビューする設定（false）に戻す（#160）。
    # 戻すと、`@coderabbitai review` は上限を消費し、以後の push でも再レビューされるので使わない。
    # ただし、PR を作ったときのレビューが障害などで付かなかったときに限り、1回だけ使う（CONTRIBUTING.md）。
    auto_incremental_review: true
    # 既定ではレビュー済みのコミットが5件に達すると自動レビューが止まるので、止めない（0）。これも #160 で消す
    auto_pause_after_reviewed_commits: 0
    # release-please のリリース PR（作成者は GitHub App のボット。名前は App の名前で決まる）はレビューしない
    ignore_usernames:
      - agent-plugins-release-nakayama[bot]
  path_instructions:
    - path: "**"
      instructions: |
        このリポジトリのルールは CONTRIBUTING.md にある。書き方のルール（bash 3.2 で動くこと、
        shellcheck を通すこと、スキルから呼ぶファイルは plugins/dev-workflow/ に置くこと）と
        テストのルール（スクリプトを変えたら bats を足す、不具合の修正には修正前に失敗するテストを足す）に
        沿っているかを見る。
        plugins/dev-workflow/review/*.md と .claude/dev-workflow/review/*.md は、このリポジトリの
        レビューの観点。変更に当てはまるものを読んで、その観点で見る。
        指摘は日本語で、ファイルと行、直し方を添えて書く。

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
      - plugins/dev-workflow/review/*.md
      - .claude/dev-workflow/review/*.md
